	/* mobile (you can change 540px to whatever breakpoint you like) */

  .desktop {
    display: none;
  }
  
  .mobile {
    display: block;
    border: 1px solid red;
  }
}

/* desktop */
@media(min-width: 541px) {
  .desktop {
    display: block;
    border: 1px solid cyan;
  }
  
  .mobile {
    display: none;
  }
}
